name: Application CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: b2b_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d b2b_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/b2b_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # The repository currently has pre-existing lint debt across unrelated
      # screens (13 errors / 227 warnings). Gate this change on the files it
      # touches; keep whole-app lint cleanup in its own reviewed workstream.
      - name: Lint payroll files changed in this PR
        run: >-
          npx eslint
          src/modules/payroll/services/payrollEngine.js
          src/modules/payroll/services/payrollBatch.js
          src/modules/payroll/services/payrollValidation.js
          src/modules/payroll/pages/PayrollDashboard.jsx
          --report-unused-disable-directives

      - name: Check auth sign-out scope regression
        run: node test-auth-signout-scope.mjs

      - name: Check auth security source contracts
        run: node test-auth-security-contract.mjs

      - name: Check Karam public debug routes stay removed
        run: node scripts/security/check-karam-public-debug-routes.mjs

      - name: Check PIN rate-limit helper
        run: node test-pin-rate-limit.mjs

      - name: Check payroll fail-closed behavior
        run: node test-payroll-batch.mjs

      - name: Check delivery accounting (sales-delivery + payroll source)
        run: node test-delivery-accounting.mjs

      - name: Check delivery-based payroll sales
        run: node test-delivery-payroll.mjs

      - name: Check commission rules save (error handling)
        run: node test-commission-rules-save.mjs
      # test-profitability-calc.mjs is intentionally not here: it imports a .ts file
      # (supabase/functions/_shared/orderHistory.ts) that Node 20 cannot load; run it locally on Node >= 22.

      - name: Check B2B marketplace classification
        run: npm run test:b2b-marketplace

      - name: Check B2B atomic audit contract
        run: npm run test:b2b-atomic-audit

      - name: Check B2B atomic audit in PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/test-b2b-market-entry-atomic-audit.sql

      - name: Run creator matching and pricing regression tests
        run: node test-creator-match.mjs

      - name: Build production bundle
        run: npm run build
